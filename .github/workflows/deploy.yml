name: Deploy to Kubernetes

on:
  push:
    branches:
      - deploy/version

permissions:
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from pyproject.toml
        id: get_version
        run: |
          VERSION=$(grep '^version =' pyproject.toml | cut -d '"' -f 2)
          SHA=$(echo $GITHUB_SHA | cut -c1-7)
          echo "VERSION=$VERSION-$SHA" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/gangwon-choihyeongyun:${{ steps.get_version.outputs.VERSION }}
            ghcr.io/${{ github.repository_owner }}/gangwon-choihyeongyun:latest

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/upstage-gangwon-fastapi-lecture/infra/k8s/application
            sed -i "s|image: .*gangwon-choihyeongyun:.*|image: ghcr.io/${{ github.repository_owner }}/gangwon-choihyeongyun:${{ steps.get_version.outputs.VERSION }}|g" 04-backend.yaml
            kubectl apply -f 04-backend.yaml -n choihyeongyun
